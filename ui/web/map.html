<style>
html, body, #map {
    height: 100%;
    margin: 0;
    background: #1a2633;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
}
.ship-icon {
    transform-origin: center;
}
.ais-icon {
    transform-origin: center;
}
.map-control {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: calc(100% - 65px);
}
.map-control select {
    font: 13px Arial, sans-serif;
    color: #e8f3f7;
    background: #172a35;
    border: 1px solid #4b6471;
    border-radius: 4px;
    height: 32px;
    width: 190px;
}
.map-select-control {
    display: inline-flex;
    width: 190px;
    max-width: calc(100vw - 20px);
    min-width: 0;
}
.map-control .map-select-trigger, .offline-area-tools .map-select-trigger {
    position: relative;
    width: 100%;
    height: 32px;
    padding: 0 24px 0 8px;
    color: #e8f3f7;
    background: #172a35;
    border: 1px solid #4b6471;

    text-align: left;

    text-overflow: ellipsis;

}
.map-select-trigger::after {
    content: '\25be';

    right: 8px;

}
.map-select-trigger:focus-visible { outline: 2px solid #4ea3cf; outline-offset: 1px; }
.map-select-menu {
    position: fixed;
    z-index: 4000;
    padding: 3px;

    overflow: auto;

}
.map-select-menu[hidden] { display: none; }
.map-select-menu button {
    display: block;
    width: 100%;
    min-height: 28px;

.map-select-menu button:disabled { color: #879ba5; }
.offline-area-tools .map-select-control { width: 156px; }
.enc-status {

.leaflet-tooltip.enc-depth { background: transparent; border: 0; box-shadow: none; color: #203d4b; font: 11px Arial, sans-serif; padding: 0; }
.leaflet-tooltip.enc-depth::before { display: none; }
.leaflet-tooltip.enc-depth-shallow { color: #162933; font-weight: bold; }
.offline-area-capture {
    position: absolute;

    z-index: 3000;

}
.offline-area-tools {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3001;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: calc(100% - 60px);
    width: 590px;

.offline-area-legend {

}
@media (max-width: 1150px) {
    .offline-area-tools { top: calc(var(--map-toolbar-bottom, 42px) + 12px); max-width: calc(100% - 70px); }
}
.offline-area-legend span { display: inline-flex; align-items: center; gap: 5px; }
.offline-area-warning { flex-basis: 100%; color: #f0bf46; font-size: 12px; }
.offline-area-swatch { width: 12px; height: 12px; border: 2px solid; box-sizing: border-box; }
.offline-area-swatch.harbour { border-color: #05bdd1; background: #05bdd133; }
.offline-area-swatch.regional { border-color: #449af0; background: #449af033; }
.offline-area-swatch.overview { border-color: #f0bf46; background: #f0bf4633; }
.offline-area-swatch.downloaded { border-color: #cbdde6; background: #cbdde644; }
.offline-area-swatch.planned { border-color: #cbdde6; border-style: dashed; }
.leaflet-tooltip.offline-area-label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 5px;
    background: rgba(16, 27, 35, 0.42);
    color: #eff8fb;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    border: 0;
    border-radius: 2px;
    box-shadow: none;
    font: 11px/15px Arial, sans-serif;
    max-width: 190px;
    box-sizing: border-box;
    width: max-content;
    white-space: nowrap;
    pointer-events: none;
}
.offline-area-name { overflow: hidden; text-overflow: ellipsis; }
.offline-area-size { flex-shrink: 0; color: #d1e0e7; }
.map-control button {
    background: #101419;
    color: #d8e0e8;
    border: 1px solid #354454;
    border-radius: 4px;
    width: 34px;
    height: 32px;
    padding: 0;
    font: 18px Arial, sans-serif;
    line-height: 30px;
}
.map-control button.active {
    background: #2f6f94;
    border-color: #4ea3cf;
    color: #ffffff;
}
#encLayersBtn { width: auto; min-width: 64px; padding: 0 8px; font-size: 13px; }
.route-context-menu {
    position: absolute;
    z-index: 1600;
    background: #101419;
    border: 1px solid #4b6471;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
}
.route-context-menu button {
    display: block;
    width: 190px;
    padding: 8px 10px;
    background: #101419;
    color: #e8f3f7;
    border: 0;
    text-align: left;
    font: 12px Arial, sans-serif;
}
.route-context-menu button:hover {

}
.leaflet-tooltip-pane {
    z-index: 2200;
    pointer-events: none;
}
.leaflet-tooltip {
    background: rgba(16, 20, 25, 0.90);
    border: 1px solid rgba(216, 224, 232, 0.72);
    color: rgba(255, 255, 255, 0.96);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.34);
    font: 12px Arial, sans-serif;
    opacity: 1;
}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
    opacity: 0.90;
}
.ais-popup {
    min-width: 230px;
    color: #d8e0e8;
    font: 12px Arial, sans-serif;
}
.ais-popup h3 {
    margin: 0 0 6px 0;
    color: #ffffff;
    font-size: 14px;
}
.ais-popup table {
    width: 100%;

}
.ais-popup td {
    padding: 2px 4px;
    border-bottom: 1px solid rgba(216, 224, 232, 0.14);
}
.ais-popup td:first-child {
    color: #9fb5bf;
    width: 42%;
}
.ais-popup .ais-nowrap {
    white-space: nowrap;
}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: rgba(16, 20, 25, 0.94);
    color: #d8e0e8;
    border: 1px solid rgba(216, 224, 232, 0.40);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
}
.leaflet-popup-close-button {
    color: #d8e0e8 !important;
}

<body>
<div id="map"></div>
<div class="map-control">
    <button id="centerBtn" title="Center on own ship" onclick="centerOwnship()">⌖</button>
    <button id="followBtn" title="Follow own ship" onclick="toggleFollowOwnship()">◎</button>
    <button id="vectorModeBtn" title="Switch to predicted path" onclick="toggleVectorMode()">↦</button>
    <button id="expandBtn" title="Open map in separate window" onclick="requestMapExpand()">⛶</button>
    <select id="mapSource" aria-label="2D map source" onchange="emitMapCommand({action:'map_source', source:this.value})">
        <option value="online">OpenSeaMap (Online)</option>
        <option value="protomaps" disabled>Protomaps (Offline)</option>
        <option value="s57" disabled>S-57 (Experimental)</option>
    </select>
    <button id="encLayersBtn" title="S57 chart layers" onclick="emitMapCommand({action:'s57_layers'})" hidden>Layers</button>
</div>
<div id="encStatus" class="enc-status" role="status" hidden></div>

<script>
let map;
let ship = null;
let shipVector = null;
let shipHeadingLine = null;
let ownShipHistoryLayer = null;
let ownShipHistory = [];
let ownShipHistoryLine = null;
let aisLayer = null;
let aisVectorLayer = null;
let routeLayer = null;
let baseLayer = null;
let seaLayer = null;
let encLayer = null;
let encRenderer = null;
let encSource = null;
let encFetch = null;
let encTimer = null;
let encSequence = 0;
let encCoverage = null;
let encIncompleteCoverage = null;
let encPendingCoverage = null;
let encReloadNeeded = false;
let encRetryDelay = 750;
let ownShipLatLng = null;
let routeEvents = [];
let mapContextInstalled = false;
let routeEditInstalled = false;
let routeWaypointMarkers = [];
let mapBridge = null;
let contextMenu = null;
let contextMode = "sensor";
let followOwnShip = false;
let offlineAreaSelection = null;
let aisPopupOpen = false;
let aisMarkers = new Map();
let aisVectors = new Map();
let aisVectorHandles = new Map();
let aisMarkerCreateCount = 0;
let aisVectorCreateCount = 0;
let hoveredAisKey = null;
let vectorMode = "vector";
let aisEditMode = false;
let syntheticDragLocks = 0;
let navigationStateRestored = false;
window.exportNavigationState = () => ({
    center: map ? [map.getCenter().lat, map.getCenter().lng] : null,
    zoom: map?.getZoom(), follow: followOwnShip, vectorMode,
    busy: Boolean(offlineAreaSelection || syntheticDragLocks)
});
window.restoreNavigationState = state => {
    if (!map || !Array.isArray(state?.center)) return;
    navigationStateRestored = true;
    followOwnShip = Boolean(state.follow);
    vectorMode = state.vectorMode === 'predicted' ? 'predicted' : 'vector';
    updateVectorModeButton();
    map.options.touchZoom = followOwnShip ? 'center' : true;
    document.getElementById('followBtn')?.classList.toggle('active', followOwnShip);
    map.setView(state.center, Number(state.zoom), {animate: false});
};
const MAX_OWN_SHIP_HISTORY_POINTS = 4096;
const MAX_OWN_SHIP_HISTORY_SPACING_M = 128;
let ownShipHistorySpacingM = 2;
let trackpadWheelSessionUntil = 0;
let smoothZoomFrame = 0;
let smoothZoomTarget = null;
let smoothZoomCenter = null;
let smoothZoomLastFrame = 0;
let smoothZoomLastInput = 0;
let smoothZoomActive = false;
let trackpadPanFrame = 0;
let trackpadPanX = 0;
let trackpadPanY = 0;

function flushTrackpadPan() {
    if (trackpadPanFrame) window.cancelAnimationFrame(trackpadPanFrame);
    trackpadPanFrame = 0;
    if (!map) return;
    const x = Math.round(trackpadPanX), y = Math.round(trackpadPanY);
    trackpadPanX -= x;
    trackpadPanY -= y;
    if (x || y) map.panBy([x, y], {animate: false, noMoveStart: true});
}

function endSmoothMapZoom() {
    if (!map || !smoothZoomActive) return;
    if (smoothZoomFrame) window.cancelAnimationFrame(smoothZoomFrame);
    const center = followOwnShip && ownShipLatLng ? L.latLng(ownShipLatLng) : smoothZoomCenter;
    if (center && Number.isFinite(smoothZoomTarget)) {
        map._move(center, smoothZoomTarget, {pinch: true, round: false});
    }
    map._moveEnd(true);
    smoothZoomActive = false;
    smoothZoomTarget = null;
    smoothZoomCenter = null;
    smoothZoomLastFrame = 0;
    smoothZoomFrame = 0;
}

function animateSmoothMapZoom(timestamp) {
    smoothZoomFrame = 0;
    if (!map || !smoothZoomActive || !Number.isFinite(smoothZoomTarget)) return;
    const currentZoom = map.getZoom();
    const remaining = smoothZoomTarget - currentZoom;
    const elapsed = smoothZoomLastFrame ? Math.min(34, timestamp - smoothZoomLastFrame) : 16;
    smoothZoomLastFrame = timestamp;
    const settled = Math.abs(remaining) < 0.0015;
    if (settled && timestamp - smoothZoomLastInput >= 70) {
        endSmoothMapZoom();
        return;
    }
    const blend = 1.0 - Math.exp(-elapsed / 72.0);
    const interpolatedStep = remaining * blend;
    const limitedStep = Math.max(-0.24, Math.min(0.24, interpolatedStep));
    const nextZoom = settled ? smoothZoomTarget : currentZoom + limitedStep;
    const center = followOwnShip && ownShipLatLng ? L.latLng(ownShipLatLng) : smoothZoomCenter;
    if (center) map._move(center, nextZoom, {pinch: true, round: false});
    smoothZoomFrame = window.requestAnimationFrame(animateSmoothMapZoom);
}

function beginSmoothMapZoom() {
    if (smoothZoomActive || !map) return;
    flushTrackpadPan();
    trackpadPanX = trackpadPanY = 0;
    map.stop();
    smoothZoomActive = true;
    smoothZoomTarget = map.getZoom();
    smoothZoomCenter = followOwnShip && ownShipLatLng
        ? L.latLng(ownShipLatLng)
        : map.getCenter();
    smoothZoomLastFrame = 0;
    map._moveStart(true, false);
}

function forwardWheelZoom(deltaY, clientX = null, clientY = null, deltaMode = 0) {
    if (!map) return false;
    const modeScale = Number(deltaMode) === 1 ? 20.0 : (Number(deltaMode) === 2 ? 60.0 : 1.0);
    const steps = -(Number(deltaY) || 0) * modeScale / 120.0;
    if (Math.abs(steps) < 1e-9) return false;
    beginSmoothMapZoom();
    smoothZoomTarget = Math.max(
        map.getMinZoom(),
        Math.min(map.getMaxZoom(), smoothZoomTarget + steps)
    );
    smoothZoomLastInput = performance.now();
    if (!smoothZoomFrame) {
        smoothZoomFrame = window.requestAnimationFrame(animateSmoothMapZoom);
    }
    return true;
}

window.zoomMapByNativeGesture = function(steps, clientX = null, clientY = null) {
    const amount = Math.max(-4, Math.min(4, Number(steps) || 0));
    if (Math.abs(amount) < 1e-9) return false;
    return forwardWheelZoom(-amount * 120.0, clientX, clientY, 0);
};

window.panMapByTrackpad = function(deltaX, deltaY) {
    if (!map) return false;
    const x = Number(deltaX), y = Number(deltaY);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    if (x === 0 && y === 0) return false;
    endSmoothMapZoom();
    trackpadPanX += x;
    trackpadPanY += y;
    if (!trackpadPanFrame) trackpadPanFrame = window.requestAnimationFrame(flushTrackpadPan);
    return true;
};

function installTrackpadPan() {
    const container = map.getContainer();
    document.addEventListener('wheel', (event) => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        forwardWheelZoom(event.deltaY, event.clientX, event.clientY, event.deltaMode);
    }, {passive: false, capture: true});
    container.addEventListener('wheel', (event) => {
        if (event.ctrlKey) return;
        const horizontal = Math.abs(Number(event.deltaX) || 0);
        const vertical = Math.abs(Number(event.deltaY) || 0);
        const now = performance.now();
        // Native Qt input retains the device information; a small browser
        // delta alone can also be a high-resolution physical mouse wheel.
        const looksLikeTrackpad = event.deltaMode === 0 && (horizontal > 0.5
            || (vertical < 50 && now < trackpadWheelSessionUntil));
        if (!looksLikeTrackpad) {
            trackpadWheelSessionUntil = 0;
            event.preventDefault();
            event.stopImmediatePropagation();
            forwardWheelZoom(event.deltaY, event.clientX, event.clientY, event.deltaMode);
            return;
        }
        trackpadWheelSessionUntil = now + 140;
        event.preventDefault();
        event.stopImmediatePropagation();
        window.panMapByTrackpad(event.deltaX, event.deltaY);
    }, {passive: false, capture: true});
}

function installTwoButtonZoom() {
    const container = map.getContainer();
    let gesture = null;
    let suppressContextUntil = 0;
    const finish = () => {
        if (!gesture) return;
        if (gesture.dragging && !syntheticDragLocks) map.dragging.enable();
        container.style.cursor = gesture.cursor;
        gesture = null;
        suppressContextUntil = performance.now() + 250;
    };
    const start = event => {
        if ((event.buttons & 3) !== 3 || gesture || syntheticDragLocks || !map.dragging.enabled()) return;
        const menu = event.target.closest('.route-context-menu');
        if (!container.contains(event.target) && !menu) return;
        if (!menu && event.target.closest('button,input,select,.leaflet-control,.leaflet-marker-draggable,.offline-area-tools,.offline-area-capture')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        endSmoothMapZoom();
        hideRouteContextMenu();
        gesture = {y: event.clientY, dragging: map.dragging.enabled(), cursor: container.style.cursor};
        map.dragging.disable();
        container.style.cursor = 'ns-resize';
    };
    document.addEventListener('mousedown', start, true);
    document.addEventListener('mousemove', event => {
        if (!gesture) start(event);
        if (!gesture) return;
        if ((event.buttons & 3) !== 3) { finish(); return; }
        event.preventDefault();
        event.stopImmediatePropagation();
        forwardWheelZoom((event.clientY - gesture.y) * 1.2);
        gesture.y = event.clientY;
    }, true);
    document.addEventListener('mouseup', event => {
        if (!gesture || (event.buttons & 3) === 3) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        finish();
    }, true);
    document.addEventListener('contextmenu', event => {
        if (!gesture && performance.now() >= suppressContextUntil) return;
        event.preventDefault();
        event.stopImmediatePropagation();
    }, true);
    window.addEventListener('blur', finish);
}

function createShipIcon(heading) {
    const normalized = ((Number(heading) || 0) % 360 + 360) % 360;
    return L.divIcon({
        className: "ship-icon",
        html: `<svg width="26" height="26" viewBox="0 0 22 22" style="transform: rotate(${normalized}deg); overflow: visible; filter: drop-shadow(0 0 1px rgba(255,255,255,0.9));">
            <polygon points="11,2 19,19 11,15 3,19"
                fill="#ffc94f"
                stroke="#0a1720"
                stroke-width="2.6"
                stroke-linejoin="round"/>
        </svg>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
    });
}

function updateShipMarkerIcon(marker, heading) {
    const normalized = ((Number(heading) || 0) % 360 + 360) % 360;
    const element = marker.getElement();
    const svg = element ? element.querySelector('svg') : null;
    if (!svg) {
        marker.setIcon(createShipIcon(normalized));
        return;
    }
    svg.style.transform = `rotate(${normalized}deg)`;
}

function createAISIcon(course) {
    return createAISIconStyled(course, "#38d66b", 2.2);
}

function createAISIconStyled(course, color, width) {
    return L.divIcon({
        className: "ais-icon",
        html: `<svg width="22" height="22" viewBox="0 0 22 22" style="transform: rotate(${course}deg); overflow: visible;">
            <polygon points="11,2 19,19 11,15 3,19"
                fill="none"
                stroke="${color}"
                stroke-width="${width}"
                stroke-linejoin="round"/>
        </svg>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
    });
}

function updateAISMarkerIcon(marker, course, color, width) {
    const element = marker.getElement();
    const svg = element ? element.querySelector('svg') : null;
    const polygon = element ? element.querySelector('polygon') : null;
    if (!svg || !polygon) {
        marker.setIcon(createAISIconStyled(course, color, width));
        return;
    }
    svg.style.transform = `rotate(${course}deg)`;
    polygon.setAttribute('stroke', color);
    polygon.setAttribute('stroke-width', width);
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[char]));
}

function formatAISValue(value, suffix = "") {
    if (value === null || value === undefined || value === "") return "";
    if (typeof value === "number" && Number.isFinite(value)) {
        return `${value.toFixed(Math.abs(value) >= 100 ? 0 : 1)}${suffix}`;
    }
    return `${escapeHtml(value)}${suffix}`;
}

function formatAISAgeSeconds(value) {
    const seconds = Number(value);
    return Number.isFinite(seconds) ? `${Math.max(0, Math.round(seconds))} s` : "";
}

function aisPopupHtml(target) {
    const rows = [
        ["MMSI", target.mmsi],
        ["Callsign", target.callsign],
        ["Type", target.ship_type],
        ["Navigation", target.nav_status],
        ["Position", `${formatAISValue(target.lat)} / ${formatAISValue(target.lon)}`],
        ["SOG", target.speed !== undefined ? formatAISValue(Number(target.speed), " kn") : ""],
        ["COG", target.course !== undefined ? formatAISValue(Number(target.course), "°") : ""],
        ["Heading", target.heading !== undefined ? formatAISValue(Number(target.heading), "°") : ""],
        ["ROT", target.rot !== undefined ? formatAISValue(Number(target.rot), "°/min") : ""],
        ["Length", target.length !== undefined ? formatAISValue(Number(target.length), " m") : ""],
        ["Beam", target.beam !== undefined ? formatAISValue(Number(target.beam), " m") : ""],
        ["Draught", target.draught !== undefined ? formatAISValue(Number(target.draught), " m") : ""],
        ["Destination", target.destination],
        ["ETA", target.eta],
        ["Distance", target.distance_nm !== undefined ? formatAISValue(Number(target.distance_nm), " NM") : ""],
        ["Real report age", target.provider_report_age_s !== null && target.provider_report_age_s !== undefined
            ? formatAISValue(Number(target.provider_report_age_s), " s") : ""],
        ["Last real interval", target.provider_report_interval_s !== null && target.provider_report_interval_s !== undefined
            ? formatAISValue(Number(target.provider_report_interval_s), " s") : ""],
        ["Position source", target.dead_reckoning_active
            ? `<span class="ais-nowrap">Dead reckoning ${formatAISAgeSeconds(target.dead_reckoning_age_s)}</span>`
            : "Provider report"],
        ["Status", target.active === false ? "Outside output limits" : "Output active"]
    ].filter(([, value]) => value !== "" && value !== null && value !== undefined);
    const rowHtml = rows.map(([label, value]) => `<tr><td>${escapeHtml(label)}</td><td>${value}</td></tr>`).join("");
    return `<div class="ais-popup"><h3>${escapeHtml(target.name || "AIS target")}</h3><table>${rowHtml}</table></div>`;
}

function setMapSource(source) {
    if (!map || !source) return;
    if (baseLayer) map.removeLayer(baseLayer);
    if (seaLayer && map.hasLayer(seaLayer)) map.removeLayer(seaLayer);
    clearTimeout(encTimer);
    encFetch?.abort();
    encSequence += 1;
    encCoverage = null;
    encIncompleteCoverage = null;
    encPendingCoverage = null;
    encReloadNeeded = false;
    encRetryDelay = 750;
    encSource = null;
    if (encLayer) { map.removeLayer(encLayer); encLayer = null; }
    map.attributionControl.removeAttribution('S57 ENC | Simulator portrayal, not for navigation');
    const status = document.getElementById('encStatus');
    status.hidden = true;
    const select = document.getElementById('mapSource');
    select.replaceChildren();
    const choices = source.available || [{id: source.offline ? 'protomaps' : 'online', label: source.offline ? 'Protomaps (Offline)' : 'OpenSeaMap (Online)', enabled: true}];
    for (const choice of choices) {
        const option = new Option(choice.label, choice.id);
        option.disabled = !choice.enabled;
        select.add(option);
    }
    const selected = source.id || (source.offline ? 'protomaps' : 'online');
    if (selected === 'schematic') select.add(new Option('Offline coastlines', 'schematic'));
    select.value = selected;
    MapSelect.enhance(select).refresh();
    document.getElementById('encLayersBtn').hidden = selected !== 's57';
    map.getContainer().style.background = selected === 's57' ? '#d0e8ed' : '#1a2633';
    if (selected === 's57') {
        baseLayer = source.url ? L.tileLayer(source.url, {
            maxZoom:19, minNativeZoom:source.minZoom ?? 0, maxNativeZoom:source.maxZoom ?? 12,
            attribution:source.attribution || 'Schematic coastlines | OpenStreetMap contributors / ODbL | not a navigation chart'
        }).addTo(map) : null;
        encSource = source;
        encRenderer ||= S57Portrayal.renderer({pane: 'encPane', padding: 0.3});
        encLayer = L.geoJSON(null, {
            pane: 'encPane', renderer: encRenderer, style: encStyle,
            pointToLayer: (feature, ll) => S57Portrayal.point(feature, ll, encRenderer),
            onEachFeature: (feature, layer) => {
                const firstClick = event => {
                    layer.off('click', firstClick);
                    const p = feature.properties;
                    layer.bindPopup(`<strong>${escapeHtml(p.OBJNAM || S57Portrayal.objectName(p))}</strong><br>${escapeHtml(p.layer)} · ${escapeHtml(p.chart)}<br>`
                        + S57Portrayal.details(p).map(({label,value}) => `${escapeHtml(label)}: ${escapeHtml(value)}`).join('<br>'));
                    layer.openPopup(event.latlng);
                };
                layer.on('click', firstClick);
            }
        }).addTo(map);
        map.attributionControl.addAttribution('S57 ENC | Simulator portrayal, not for navigation');
        scheduleENC();
        return;
    }
    if (encRenderer && map.hasLayer(encRenderer)) map.removeLayer(encRenderer);
    baseLayer = L.tileLayer(source.url || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        maxNativeZoom: source.maxZoom ?? 19,
        minNativeZoom: source.minZoom ?? 0,
        attribution: source.attribution || '&copy; OpenStreetMap contributors'
    }).addTo(map);
    if (!source.offline && seaLayer) seaLayer.addTo(map);
}

function encStyle(feature) {
    return S57Portrayal.style(feature);
}

function scheduleENC() {
    if (!encSource || document.hidden) return;
    clearTimeout(encTimer);
    encTimer = setTimeout(loadENC, 180);
}

async function loadENC() {
    if (!encSource || !map || document.hidden) return;
    const current = map.getBounds();
    const zoom = Math.floor(map.getZoom());
    if (encCoverage && encCoverage.zoom === zoom && encCoverage.bounds.contains(current)) return;
    const retry = encIncompleteCoverage?.zoom === zoom && encIncompleteCoverage.bounds.contains(current)
        ? encIncompleteCoverage : null;
    if (retry?.attempts >= 3) return;
    if (retry && Date.now() < retry.nextAttempt) {
        clearTimeout(encTimer);
        encTimer = setTimeout(loadENC, retry.nextAttempt-Date.now());
        return;
    }
    if (encPendingCoverage) {
        if (encPendingCoverage.zoom !== zoom || !encPendingCoverage.bounds.contains(current)) encReloadNeeded = true;
        return;
    }
    encFetch?.abort();
    const controller = encFetch = new AbortController();
    const sequence = ++encSequence;
    const source = encSource;
    const padded = current.pad(0.25);
    encPendingCoverage = {bounds:padded, zoom};
    encReloadNeeded = false;
    const shift = Math.floor((padded.getCenter().lng + 180) / 360) * 360;
    let west = padded.getWest() - shift, east = padded.getEast() - shift;
    const south = Math.max(-85, padded.getSouth()), north = Math.min(85, padded.getNorth());
    const pieces = east - west >= 360 ? [[-180,180]] : west < -180 ? [[west+360,180],[-180,east]] : east > 180 ? [[west,180],[-180,east-360]] : [[west,east]];
    const status = document.getElementById('encStatus');
    try {
        const results = await Promise.all(pieces.map(async ([w,e]) => {
            const url = new URL(source.encUrl);
            url.searchParams.set('bbox', [w,south,e,north].join(','));
            url.searchParams.set('zoom', zoom);
            url.searchParams.set('layers', source.layers === null || source.layers === undefined ? '*' : source.layers.join(','));
            url.searchParams.set('display', source.base ? 'base' : 'all');
            url.searchParams.set('contour', source.safetyContour ?? 30);
            url.searchParams.set('depth', source.safetyDepth ?? 30);
            const response = await fetch(url, {signal: controller.signal});
            if (!response.ok) {
                const problem = await response.json().catch(() => null);
                throw new Error(problem?.error || `Local chart service: ${response.status}`);
            }
            return response.json();
        }));
        if (sequence !== encSequence || source !== encSource) return;
        const features = results.flatMap(result => result.features);
        encLayer.clearLayers();
        encLayer.options.coordsToLatLng = coordinates => {
            let lon = coordinates[0] + shift;
            while (lon < padded.getWest() - 180) lon += 360;
            while (lon > padded.getEast() + 180) lon -= 360;
            return L.latLng(coordinates[1], lon);
        };
        encLayer.addData({type:'FeatureCollection', features: features.slice(0,8000)});
        let labels = 0, clearances = 0;
        encLayer.eachLayer(layer => {
            const p = layer.feature?.properties;
            if (p?.layer === 'SOUNDG' && p.DEPTH !== undefined && labels++ < 150) {
                layer.bindTooltip(String(Number(p.DEPTH).toFixed(1)), {permanent:true, direction:'center',
                    className:p.shallow_sounding ? 'enc-depth enc-depth-shallow' : 'enc-depth'});
            }
            if (p && ['CBLOHD','PIPOHD','BRIDGE'].includes(p.layer) && zoom>=12 && clearances<30) {
                const text=S57Portrayal.clearanceText(p);
                if (text) {
                    clearances++;
                    layer.bindTooltip(text,{permanent:true,direction:'top',className:'enc-clearance'});
                }
            }
        });
        const retryable = results.some(result => result.retryable);
        encCoverage = retryable ? null : {bounds:padded, zoom};
        encIncompleteCoverage = retryable ? {bounds:padded, zoom, attempts:retry ? retry.attempts+1 : 0,
            nextAttempt:Date.now()+encRetryDelay} : null;
        if (retryable) {
            clearTimeout(encTimer);
            if (encIncompleteCoverage.attempts < 3 && !document.hidden) encTimer = setTimeout(loadENC, encRetryDelay);
            encRetryDelay = Math.min(8000, encRetryDelay * 2);
        } else encRetryDelay = 750;
        const limited = results.some(result => result.limited) || features.length > 8000;
        const contours = Object.assign({}, ...results.map(result => result.effective_safety_contours || {}));
        const values = [...new Set(Object.values(contours).filter(value => Number.isFinite(value)))].sort((a,b) => a-b);
        const differs = values.some(value => value !== (source.safetyContour ?? 30));
        const missing = Object.values(contours).some(value => value === null);
        const effective = values.slice(0,4).join(' / ') + (values.length>4 ? ' / ...' : '');
        const safety = differs || missing ? `Safety contour: ${source.safetyContour ?? 30} m | Cell contours: ${effective ? effective+' m' : 'not available'}${missing && effective ? ' / unavailable in some cells' : ''}` : '';
        const mode = source.base ? `Base | ${safety || `Safety contour: ${source.safetyContour ?? 30} m`} | Depth/height: m | North: up` : safety;
        status.title = Object.entries(contours).map(([cell,value]) => `${cell}: ${value === null ? 'no contour at or deeper than requested' : value+' m'}`).join('\n');
        status.textContent = (retryable ? encIncompleteCoverage.attempts < 3
            ? 'Loading remaining chart detail...' : 'Chart loading incomplete; move or zoom to retry'
            : limited ? 'Chart detail limited; zoom in' : !features.length
            ? results.some(result => result.overview) ? 'World overview; zoom in for S57 charts'
                : 'No S57 data at this scale/location; schematic coastline background' : '') || mode;
        status.hidden = !status.textContent;
    } catch (error) {
        if (error.name !== 'AbortError' && sequence === encSequence) {
            status.textContent = `S57 unavailable: ${error.message}`;
            status.hidden = false;
            encCoverage = null;
            clearTimeout(encTimer);
            encTimer = setTimeout(loadENC, encRetryDelay);
            encRetryDelay = Math.min(8000, encRetryDelay * 2);
        }
    } finally {
        if (sequence === encSequence) {
            encPendingCoverage = null;
            encFetch = null;
            if (encReloadNeeded && !document.hidden) scheduleENC();
        }
    }
}

function fitChartBounds(bounds) {
    if (!map || !Array.isArray(bounds) || bounds.length !== 4 || !bounds.every(Number.isFinite)) return;
    disableFollowOwnship();
    map.fitBounds([[bounds[1],bounds[0]],[bounds[3],bounds[2]]], {padding:[30,30]});
}
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(encTimer); encFetch?.abort(); }
    else scheduleENC();
});

function offlinePolygonValid(points) {
    if (!Array.isArray(points) || points.length < 3 || points.length > 64
        || points.some(point => !Array.isArray(point) || point.length !== 2 || !point.every(Number.isFinite))) return false;
    const cross = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const on = (a, b, p) => Math.abs(cross(a, b, p)) < 1e-12
        && p[0] >= Math.min(a[0], b[0]) && p[0] <= Math.max(a[0], b[0])
        && p[1] >= Math.min(a[1], b[1]) && p[1] <= Math.max(a[1], b[1]);
    let area = 0;
    for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        if (a[0] === b[0] && a[1] === b[1]) return false;
        area += cross(points[0], a, b);
        for (let j = i + 2; j < points.length; j++) {
            if (i === 0 && j === points.length - 1) continue;
            const c = points[j], d = points[(j + 1) % points.length];
            if (cross(a, b, c) * cross(a, b, d) < 0 && cross(c, d, a) * cross(c, d, b) < 0
                || on(a, b, c) || on(a, b, d) || on(c, d, a) || on(c, d, b)) return false;
        }
    }
    return Math.abs(area) > 1e-12;
}

function offlineAreaTileCounts(bounds, zoom, polygon = null) {
    const [west, south, east, north] = bounds;
    if (!bounds.every(Number.isFinite) || west < -180 || east > 180 || west >= east || south < -85 || north > 85 || south >= north) return null;
    if (polygon && !offlinePolygonValid(polygon)) return null;
    const counts = [];
    for (let z = 0; z <= zoom; z++) {
        const scale = 2 ** z;
        const left = Math.max(0, Math.floor((west + 180) / 360 * scale));
        const right = Math.min(scale - 1, Math.floor((east + 180) / 360 * scale));
        const row = lat => Math.max(0, Math.min(scale - 1, Math.floor((1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * scale)));
        if (!polygon) {
            counts.push((right - left + 1) * (row(south) - row(north) + 1));
            continue;
        }
        const points = polygon.map(([lon, lat]) => [(lon + 180) / 360 * scale,
            (1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * scale]);
        let count = 0;
        // Merge boundary projections and interior scanlines into tile runs.
        for (let y = row(north); y <= row(south); y++) {
            const intervals = [], crossings = [];
            const add = (a, b) => intervals.push([Math.max(0, Math.floor(Math.min(a, b))),
                Math.min(scale - 1, Math.floor(Math.max(a, b)))]);
            for (let i = 0; i < points.length; i++) {
                const a = points[i], b = points[(i + 1) % points.length];
                const low = Math.max(y, Math.min(a[1], b[1])), high = Math.min(y + 1, Math.max(a[1], b[1]));
                const xAt = height => a[0] + (height - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);
                if (low <= high) {
                    if (a[1] === b[1]) add(a[0], b[0]);
                    else add(xAt(low), xAt(high));
                }
                if ((a[1] > y + 0.5) !== (b[1] > y + 0.5)) crossings.push(xAt(y + 0.5));
            }
            crossings.sort((a, b) => a - b);
            for (let i = 0; i + 1 < crossings.length; i += 2) add(crossings[i], crossings[i + 1]);
            intervals.sort((a, b) => a[0] - b[0]);
            let end = -1;
            for (const [start, stop] of intervals) {
                count += Math.max(0, stop - Math.max(start, end + 1) + 1);
                end = Math.max(end, stop);
            }
        }
        counts.push(count);
    }
    return counts;
}

function offlineAreaEstimate(bounds, zoom, polygon = null) {
    return offlineAreaTileCounts(bounds, zoom, polygon)?.reduce((sum, count) => sum + count, 0) ?? null;
}

function offlineAreaColour(zoom) {
    return zoom === 15 ? '#05bdd1' : zoom === 14 ? '#449af0' : '#f0bf46';
}

function offlineAreaLabel(name, sizeMb = null) {
    const size = Number.isFinite(sizeMb) && sizeMb >= 0
        ? `<span class="offline-area-size">${sizeMb < 1 ? '&lt;1' : Math.round(sizeMb)} MB</span>` : '';
    return `<span class="offline-area-name">${escapeHtml(name)}</span>` + size;
}

function beginOfflineAreaSelection(options = {}) {
    if (!map || offlineAreaSelection) return;
    endSmoothMapZoom();
    hideRouteContextMenu();
    const saved = {follow: followOwnShip};
    followOwnShip = false;
    map.options.touchZoom = true;
    document.getElementById('followBtn')?.classList.remove('active');
    const capture = document.createElement('div');
    capture.className = 'offline-area-capture';
    map.getContainer().appendChild(capture);
    const tools = document.createElement('div');
    tools.className = 'offline-area-tools';
    tools.innerHTML = '<button data-mode="navigate" class="active">Navigate</button>'
        + '<button data-mode="draw">Rectangle</button>'
        + '<button data-mode="polygon">Polygon</button>'
        + '<select aria-label="Detail for new areas"><option value="15">Harbour detail</option><option value="14">Regional detail</option><option value="13">Overview</option></select>'
        + '<button data-action="close" hidden disabled>Close Polygon</button>'
        + '<button data-action="undo" title="Remove last corner or area" disabled>Undo</button>'
        + '<button data-action="next" disabled>Continue</button>'
        + '<button data-action="cancel">Cancel</button>'
        + '<div class="offline-area-legend" aria-label="Area colours and download status">'
        + '<span><i class="offline-area-swatch harbour"></i>Harbour</span>'
        + '<span><i class="offline-area-swatch regional"></i>Regional</span>'
        + '<span><i class="offline-area-swatch overview"></i>Overview</span>'
        + '<span><i class="offline-area-swatch downloaded"></i>Downloaded</span>'
        + '<span><i class="offline-area-swatch planned"></i>To download</span></div>'
        + '<div class="offline-area-warning" role="status" aria-live="polite" hidden></div>';
    map.getContainer().appendChild(tools);
    const detailControl = MapSelect.enhance(tools.querySelector('select'));
    const areas = [];
    const downloaded = [];
    for (const area of options.downloadedAreas || []) {
        const bounds = area.bounds;
        const zoom = Number(area.max_zoom);
        if (!Array.isArray(bounds) || bounds.length !== 4 || ![13, 14, 15].includes(zoom)
            || offlineAreaEstimate(bounds, 0) === null || area.polygon && !offlinePolygonValid(area.polygon)) continue;
        const [west, south, east, north] = bounds;
        const geometry = area.polygon ? area.polygon.map(([lon, lat]) => [lat, lon]) : [[south, west], [north, east]];
        const layer = (area.polygon ? L.polygon : L.rectangle)(geometry, {
            color: offlineAreaColour(zoom), weight: 2, fillOpacity: 0.22, interactive: false,
        }).addTo(map);
        const hasSize = Number.isFinite(area.content_bytes) && area.content_bytes >= 0;
        const sizeMb = hasSize ? area.content_bytes / (1024 ** 2) : null;
        layer.bindTooltip(offlineAreaLabel(area.name || 'Saved area', sizeMb), {
            permanent: true, direction: 'center', className: 'offline-area-label',
        });
        downloaded.push(layer);
    }
    let drawing = false;
    let start = null;
    let startPixel = null;
    let rectangle = null;
    let pointer = null;
    let drawMode = 'navigate';
    let polygon = [];
    let polygonLayer = null;
    let firstCorner = null;
    let draftError = '';
    const maxTiles = options.maxTiles || 200000;
    const warningTiles = options.warningTiles || 20000;
    function updateWarning(currentCount = 0) {
        const large = currentCount > warningTiles || areas.some(area => area.count > warningTiles);
        const warning = tools.querySelector('.offline-area-warning');
        warning.hidden = !large && !draftError;
        warning.textContent = draftError || (large ? 'Large area: downloading and preparing it may take a long time.' : '');
    }
    function rectangleLabel() {
        if (!rectangle) return;
        const bounds = rectangle.getBounds();
        const coordinates = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
        const zoom = Number(tools.querySelector('select').value);
        const count = offlineAreaEstimate(coordinates, zoom);
        updateWarning(count || 0);
        const valid = count !== null && count <= maxTiles;
        const label = offlineAreaLabel(`Area ${areas.length + 1}`);
        rectangle.setStyle({color: valid ? offlineAreaColour(zoom) : '#f16b64'});
        if (rectangle.getTooltip()) rectangle.setTooltipContent(label);
        else rectangle.bindTooltip(label, {permanent: true, direction: 'center', className: 'offline-area-label'});
        rectangle.getTooltip().setLatLng(bounds.getCenter());
        return coordinates;
    }
    function finish(command) {
        if (rectangle) map.removeLayer(rectangle);
        clearPolygon();
        for (const area of areas) map.removeLayer(area.rectangle);
        for (const layer of downloaded) map.removeLayer(layer);
        capture.remove();
        detailControl.destroy();
        tools.remove();
        document.removeEventListener('keydown', escape);
        followOwnShip = saved.follow;
        map.options.touchZoom = followOwnShip ? 'center' : true;
        document.getElementById('followBtn')?.classList.toggle('active', followOwnShip);
        offlineAreaSelection = null;
        if (followOwnShip && ownShipLatLng) {
            endSmoothMapZoom();
            map.stop();
            map.setView(ownShipLatLng, map.getZoom(), {animate: false});
        }
        emitMapCommand(command);
    }
    function updateTools() {
        updateWarning();
        tools.querySelector('[data-action="undo"]').disabled = areas.length === 0 && polygon.length === 0;
        tools.querySelector('[data-action="next"]').disabled = areas.length === 0 || polygon.length > 0
            || areas.some(area => area.count === null || area.count > maxTiles);
        tools.querySelector('[data-action="next"]').textContent = areas.length ? `Continue (${areas.length})` : 'Continue';
        tools.querySelector('[data-action="close"]').hidden = polygon.length === 0;
        tools.querySelector('[data-action="close"]').disabled = polygon.length < 3 || !offlinePolygonValid(polygon);
        capture.style.cursor = drawing ? 'crosshair' : 'grab';
    }
    function escape(event) {
        if (event.key === 'Escape') finish({action: 'offline_area_cancel'});
        if (event.key === 'Enter' && polygon.length >= 3 && event.target.tagName !== 'SELECT') {
            event.preventDefault();
            event.stopPropagation();
            finishPolygon();
        }
    }
    function clearPolygon() {
        if (polygonLayer) map.removeLayer(polygonLayer);
        if (firstCorner) map.removeLayer(firstCorner);
        polygon = [];
        polygonLayer = firstCorner = null;
        draftError = '';
    }
    function polygonPreview() {
        if (!polygon.length) { clearPolygon(); updateTools(); return; }
        const points = polygon.map(([lon, lat]) => [lat, lon]);
        const style = {color: offlineAreaColour(Number(tools.querySelector('select').value)),
            weight: 2, dashArray: '7 5', fillOpacity: 0.05, interactive: false};
        if (!polygonLayer) polygonLayer = L.polygon(points, style).addTo(map);
        else polygonLayer.setLatLngs(points).setStyle(style);
        if (!firstCorner) firstCorner = L.circleMarker(points[0], {radius: 5, color: '#ffffff',
            fillColor: style.color, fillOpacity: 1, weight: 2, interactive: false}).addTo(map);
        draftError = polygon.length >= 3 && !offlinePolygonValid(polygon) ? 'Polygon edges must not cross.' : '';
        if (draftError) polygonLayer.setStyle({color: '#f16b64'});
        updateTools();
    }
    function finishPolygon() {
        if (!offlinePolygonValid(polygon)) return;
        const bounds = polygonLayer.getBounds();
        const coordinates = [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()];
        const zoom = Number(tools.querySelector('select').value);
        const count = offlineAreaEstimate(coordinates, zoom, polygon);
        if (count === null || count > maxTiles) {
            draftError = 'Area exceeds the tile limit; reduce detail or remove corners.';
            polygonLayer.setStyle({color: '#f16b64'});
            updateTools();
            return;
        }
        polygonLayer.bindTooltip(offlineAreaLabel(`Area ${areas.length + 1}`), {
            permanent: true, direction: 'center', className: 'offline-area-label'});
        polygonLayer.getTooltip().setLatLng(bounds.getCenter());
        areas.push({rectangle: polygonLayer, bounds: coordinates, polygon: polygon.map(point => [...point]), max_zoom: zoom, count});
        polygonLayer = null;
        clearPolygon();
        updateTools();
    }
    document.addEventListener('keydown', escape);
    for (const type of ['pointerdown', 'mousedown', 'dblclick', 'wheel']) tools.addEventListener(type, event => event.stopPropagation());
    tools.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.mode) {
            if (button.dataset.mode === 'draw') clearPolygon();
            drawMode = button.dataset.mode;
            drawing = drawMode !== 'navigate';
            for (const item of tools.querySelectorAll('[data-mode]')) item.classList.toggle('active', item === button);
        } else if (button.dataset.action === 'undo') {
            if (polygon.length) { polygon.pop(); polygonPreview(); }
            else if (areas.length) map.removeLayer(areas.pop().rectangle);
        } else if (button.dataset.action === 'close') {
            finishPolygon();
        } else if (button.dataset.action === 'next' && areas.length) {
            finish({action: 'offline_area', areas: areas.map(({bounds, max_zoom, polygon}) =>
                polygon ? {bounds, max_zoom, polygon} : {bounds, max_zoom})});
            return;
        } else if (button.dataset.action === 'cancel') {
            finish({action: 'offline_area_cancel'});
            return;
        }
        updateTools();
    });
    capture.addEventListener('mousedown', event => { if (drawing) event.stopPropagation(); });
    tools.querySelector('select').addEventListener('change', () => {
        if (polygon.length) polygonPreview();
        if (rectangle) rectangleLabel();
    });
    capture.addEventListener('dblclick', event => {
        if (drawing) { event.preventDefault(); event.stopPropagation(); }
        if (drawMode === 'polygon') finishPolygon();
    });
    capture.addEventListener('pointerdown', event => {
        if (!drawing || event.button !== 0 || pointer !== null || areas.length >= 32) return;
        event.preventDefault();
        event.stopPropagation();
        if (drawMode === 'polygon') {
            const location = map.mouseEventToLatLng(event);
            const pixel = map.mouseEventToContainerPoint(event);
            if (polygon.length >= 3 && pixel.distanceTo(map.latLngToContainerPoint([polygon[0][1], polygon[0][0]])) < 8) {
                finishPolygon();
            } else if (polygon.length < 64 && (!polygon.length
                || pixel.distanceTo(map.latLngToContainerPoint([polygon.at(-1)[1], polygon.at(-1)[0]])) > 2)) {
                polygon.push([location.lng, location.lat]);
                polygonPreview();
            }
            return;
        }
        pointer = event.pointerId;
        capture.setPointerCapture(pointer);
        start = map.mouseEventToLatLng(event);
        startPixel = map.mouseEventToContainerPoint(event);
        rectangle = L.rectangle([start, start], {
            color: '#05bdd1', weight: 2, dashArray: '7 5', fillOpacity: 0.05, interactive: false,
        }).addTo(map);
        rectangleLabel();
    });
    capture.addEventListener('pointermove', event => {
        if (event.pointerId !== pointer || !rectangle) return;
        rectangle.setBounds(L.latLngBounds(start, map.mouseEventToLatLng(event)));
        rectangleLabel();
    });
    capture.addEventListener('pointerup', event => {
        if (event.pointerId !== pointer || !rectangle) return;
        const endPixel = map.mouseEventToContainerPoint(event);
        if (Math.abs(endPixel.x - startPixel.x) < 8 || Math.abs(endPixel.y - startPixel.y) < 8) {
            map.removeLayer(rectangle);
            rectangle = null;
            pointer = null;
            return;
        }
        const maxZoom = Number(tools.querySelector('select').value);
        const bounds = rectangleLabel();
        areas.push({rectangle, bounds, max_zoom: maxZoom, count: offlineAreaEstimate(bounds, maxZoom)});
        rectangle = null;
        pointer = null;
        updateTools();
    });
    capture.addEventListener('pointercancel', () => {
        if (rectangle) map.removeLayer(rectangle);
        rectangle = null;
        pointer = null;
    });
    offlineAreaSelection = {finish, areas, downloaded};
    updateTools();
}

function emitRouteEvent(event) {
    if (Number.isFinite(event.lon)) event.lon = ((event.lon + 180) % 360 + 360) % 360 - 180;
    routeEvents.push(event);
    if (mapBridge && mapBridge.sendRouteEvent) {
        mapBridge.sendRouteEvent(JSON.stringify(event));
    }
}

function emitMapCommand(command) {
    if (Number.isFinite(command.lon)) command.lon = ((command.lon + 180) % 360 + 360) % 360 - 180;
    if (mapBridge && mapBridge.sendMapCommand) {
        mapBridge.sendMapCommand(JSON.stringify(command));
    }
}

function destinationPoint(lat, lon, bearing, distanceNm) {
    const radiusNm = 3440.065;
    const angular = distanceNm / radiusNm;
    const brg = Number(bearing) * Math.PI / 180;
    const phi1 = Number(lat) * Math.PI / 180;
    const lambda1 = Number(lon) * Math.PI / 180;
    const phi2 = Math.asin(Math.sin(phi1) * Math.cos(angular) + Math.cos(phi1) * Math.sin(angular) * Math.cos(brg));
    const lambda2 = lambda1 + Math.atan2(
        Math.sin(brg) * Math.sin(angular) * Math.cos(phi1),
        Math.cos(angular) - Math.sin(phi1) * Math.sin(phi2)
    );
    return [phi2 * 180 / Math.PI, lambda2 * 180 / Math.PI];
}

function bearingBetween(a, b) {
    const first = Number(a.lat) * Math.PI / 180;
    const second = Number(b.lat) * Math.PI / 180;
    const delta = (Number(b.lng) - Number(a.lng)) * Math.PI / 180;
    const y = Math.sin(delta) * Math.cos(second);
    const x = Math.cos(first) * Math.sin(second) - Math.sin(first) * Math.cos(second) * Math.cos(delta);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function distanceBetweenNm(a, b) {
    return map.distance(a, b) / 1852.0;
}

function syntheticVectorHandleIcon() {
    return L.divIcon({
        className: "synthetic-vector-handle",
        html: '<div style="width:12px;height:12px;border:2px solid #65e8ff;background:#10232d;border-radius:50%;box-sizing:border-box;"></div>',
        iconSize: [12, 12],
        iconAnchor: [6, 6]
    });
