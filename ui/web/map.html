function updateVectorModeButton() {
    const button = document.getElementById('vectorModeBtn');
    if (!button) return;
    const predicted = vectorMode === "predicted";
    button.classList.toggle('active', predicted);
    button.textContent = predicted ? "⌒" : "↦";
    button.title = predicted ? "Switch to speed vector" : "Switch to predicted path";
}

function toggleVectorMode() {
    vectorMode = vectorMode === "predicted" ? "vector" : "predicted";
    updateVectorModeButton();
    if (!ship) return;
    const current = ship.getLatLng();
    updateShip(
        current.lat,
        current.lng,
        Number(ship.options.currentHeading || 0),
        false,
        Number(ship.options.currentSog || 0),
        Number(ship.options.currentCog || 0),
        Number(ship.options.currentRot || 0),
        false
    );
}

function buildPredictedPath(lat, lon, cog, sog, rot) {
    const speed = Math.abs(Number(sog) || 0);
    if (speed <= 0.01) return [];
    const points = [[lat, lon]];
    const horizonSec = 360; // 6 min
    const stepSec = 6;
    const speedNmPerSec = speed / 3600.0;
    let headingNow = Number(cog) || 0;
    let currentLat = lat;
    let currentLon = lon;
    const rotDegPerSec = (Number(rot) || 0) / 60.0;
    for (let t = 0; t < horizonSec; t += stepSec) {
        headingNow = (headingNow + rotDegPerSec * stepSec) % 360.0;
        const distNm = speedNmPerSec * stepSec;
        const next = destinationPoint(currentLat, currentLon, headingNow, distNm);
        points.push(next);
        currentLat = next[0];
        currentLon = next[1];
    }
    return points;
}

function headingLineCoordinates(lat, lon, heading) {
    // Mercator is conformal, so a screen-space ray preserves the heading at
    // own ship without wrapping around the globe at small zoom levels.
    const origin = map.latLngToLayerPoint([lat, lon]);
    const bearingRad = (((Number(heading) || 0) % 360) + 360) % 360 * Math.PI / 180.0;
    const size = map.getSize();
    const rayLength = Math.max(1000.0, Math.hypot(size.x, size.y) * 2.5);
    const endpoint = L.point(
        origin.x + Math.sin(bearingRad) * rayLength,
        origin.y - Math.cos(bearingRad) * rayLength
    );
    const endpointLatLng = map.layerPointToLatLng(endpoint);
    return [[lat, lon], [endpointLatLng.lat, endpointLatLng.lng]];
}

function refreshHeadingLine() {
    if (!map || !ship || !ownShipLatLng) return;
    const heading = Number(ship.options.currentHeading || 0);
    const headingCoords = headingLineCoordinates(ownShipLatLng[0], ownShipLatLng[1], heading);
    if (!shipHeadingLine) {
        shipHeadingLine = L.polyline(headingCoords, {
            pane: 'vectorPane',
            color: "#5f7483",
            weight: 1,
            opacity: 0.90
        }).addTo(map);
    } else {
        shipHeadingLine.setLatLngs(headingCoords);
    }
}

function centerOwnship() {
    if (!map || !ownShipLatLng) return;
    map.setView(ownShipLatLng, map.getZoom());
}

function toggleFollowOwnship() {
    followOwnShip = !followOwnShip;
    map.options.touchZoom = followOwnShip ? 'center' : true;
    const button = document.getElementById('followBtn');
    if (button) button.classList.toggle('active', followOwnShip);
    if (followOwnShip) centerOwnship();
}

function disableFollowOwnship() {
    if (!followOwnShip) return;
    followOwnShip = false;
    const button = document.getElementById('followBtn');
    if (button) button.classList.remove('active');
}

function beginSyntheticDrag() {
    syntheticDragLocks += 1;
    if (map && map.dragging) map.dragging.disable();
}

function endSyntheticDrag() {
    syntheticDragLocks = Math.max(0, syntheticDragLocks - 1);
    if (syntheticDragLocks === 0 && map && map.dragging) map.dragging.enable();
}

function requestMapExpand() {
    emitMapCommand({action: 'expand'});
}

function setMapDetached(detached) {
    const button = document.getElementById('expandBtn');
    if (!button) return;
    button.title = detached
        ? 'Toggle full screen (F11; Escape exits)'
        : 'Open map in separate window';
}

function setContextMode(mode) {
    contextMode = mode || "sensor";
    installMapRouteContext();
}

function updateShip(lat, lon, heading, center, sog, cog, rot, resetHistory, timeScale) {
    if (!window.mapReady) return;
    ownShipLatLng = [lat, lon];
    updateOwnShipHistory(lat, lon, resetHistory);

    if (!ship) {
        ship = L.marker([lat, lon], {
            icon: createShipIcon(heading),
            pane: 'trafficPane',
            zIndexOffset: 3000
        }).addTo(map);
        if (!navigationStateRestored) map.setView([lat, lon], map.getZoom());
    } else {
        ship.setLatLng([lat, lon]);
        updateShipMarkerIcon(ship, heading);
    }
    ship.options.currentHeading = Number(heading) || 0;
    ship.options.currentSog = Number(sog) || 0;
    ship.options.currentCog = Number(cog) || 0;
    ship.options.currentRot = Number(rot) || 0;

    if ((center || followOwnShip) && !aisPopupOpen && !smoothZoomActive && !offlineAreaSelection) {
        const c = map.getCenter();
        if (map.distance(c, [lat, lon]) > 6.0) {
            map.setView([lat, lon], map.getZoom());
        }
    }

    refreshHeadingLine();

    // Keep visual vector horizon constant at 6 simulated minutes regardless of time acceleration.
    const simHorizonHours = 6.0 / 60.0;
    const vectorDistance = Math.abs(Number(sog) || 0) * simHorizonHours;
    if (vectorMode === "predicted") {
        const predicted = buildPredictedPath(lat, lon, cog, sog, rot);
        if (predicted.length > 1) {
            if (!shipVector) {
                shipVector = L.polyline(predicted, {
                    pane: 'vectorPane',
                    color: "#26323d",
                    weight: 2,
                    opacity: 0.95
                }).addTo(map);
            } else {
                shipVector.setLatLngs(predicted);
            }
        } else if (shipVector) {
            map.removeLayer(shipVector);
            shipVector = null;
        }
    } else if (vectorDistance > 0.01) {
        const vectorCoords = [[lat, lon], destinationPoint(lat, lon, cog, vectorDistance)];
        if (!shipVector) {
            shipVector = L.polyline(vectorCoords, {
                pane: 'vectorPane',
                color: "#26323d",
                weight: 2,
                opacity: 0.95
            }).addTo(map);
        } else {
            shipVector.setLatLngs(vectorCoords);
        }
    } else if (shipVector) {
        map.removeLayer(shipVector);
        shipVector = null;
    }
}

function updateOwnShipHistory(lat, lon, resetHistory) {
    if (!ownShipHistoryLayer) return;
    if (resetHistory) {
        ownShipHistory = [];
        ownShipHistorySpacingM = 2;
        ownShipHistoryLayer.clearLayers();
        ownShipHistoryLine = null;
    }
    const point = [Number(lat), Number(lon)];
    if (!Number.isFinite(point[0]) || !Number.isFinite(point[1])) return;
    const last = ownShipHistory[ownShipHistory.length - 1];
    if (!last || map.distance(last, point) >= ownShipHistorySpacingM) {
        ownShipHistory.push(point);
        let compacted = false;
        if (ownShipHistory.length > MAX_OWN_SHIP_HISTORY_POINTS) {
            const reduced = ownShipHistory.filter((_entry, index) => index % 2 === 0);
            const newest = ownShipHistory[ownShipHistory.length - 1];
            if (reduced[reduced.length - 1] !== newest) reduced.push(newest);
            ownShipHistory = reduced;
            ownShipHistorySpacingM = Math.min(
                MAX_OWN_SHIP_HISTORY_SPACING_M,
                ownShipHistorySpacingM * 2
            );
            compacted = true;
        }
        if (ownShipHistory.length > 1) {
            if (!ownShipHistoryLine) {
                ownShipHistoryLine = L.polyline(ownShipHistory, {
                    pane: 'historyPane',
                    color: "#77b7d8",
                    weight: 1,
                    opacity: 0.58,
                    interactive: false,
                    smoothFactor: 0.8
                }).addTo(ownShipHistoryLayer);
            } else if (compacted) {
                ownShipHistoryLine.setLatLngs(ownShipHistory);
            } else {
                ownShipHistoryLine.addLatLng(point);
            }
        } else if (!ownShipHistoryLine) {
            ownShipHistoryLine = L.polyline([], {
                pane: 'historyPane',
                color: "#77b7d8",
                weight: 1,
                opacity: 0.58,
                interactive: false,
                smoothFactor: 0.8
            }).addTo(ownShipHistoryLayer);
        }
    }
}

function updateAIS(targets) {
    if (!window.mapReady) return;

    const seen = new Set();
    const seenVectors = new Set();
    targets.forEach((t, index) => {
        let lat = Number(t.lat);
        let lon = Number(t.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

        const key = String(t.mmsi || t.name || `${lat.toFixed(5)},${lon.toFixed(5)},${index}`);
        seen.add(key);
        let course = Number(t.course) || 0;
        let speed = Math.abs(Number(t.speed) || 0);
        let m = aisMarkers.get(key);
        let handle = aisVectorHandles.get(key);
        const nowMs = Date.now();
        if (m && m.syntheticPendingPosition) {
            const pending = m.syntheticPendingPosition;
            if (Math.abs(lat - pending.lat) < 0.00001 && Math.abs(lon - pending.lon) < 0.00001) {
                m.syntheticPendingPosition = null;
            } else if (nowMs < pending.expiresAt) {
                lat = pending.lat;
                lon = pending.lon;
            } else {
                m.syntheticPendingPosition = null;
            }
        }
        if (handle && handle.syntheticPendingVector) {
            const pending = handle.syntheticPendingVector;
            const courseDifference = Math.abs(((course - pending.course + 540) % 360) - 180);
            if (courseDifference < 0.2 && Math.abs(speed - pending.speed) < 0.05) {
                handle.syntheticPendingVector = null;
            } else if (nowMs < pending.expiresAt) {
                course = pending.course;
                speed = pending.speed;
            } else {
                handle.syntheticPendingVector = null;
            }
        }
        const hasReportedHeading = t.heading !== null && t.heading !== undefined && t.heading !== "";
        const reportedHeading = Number(t.heading);
        let orientation = hasReportedHeading && Number.isFinite(reportedHeading)
                && reportedHeading >= 0 && reportedHeading < 360
            ? reportedHeading
            : course;
        if (handle && handle.syntheticPendingVector) orientation = course;
        const color = t.active === false ? "#8a949d" : "#38d66b";
        const width = t.active === false ? 1.7 : 2.2;
        if (!m) {
            m = L.marker([lat, lon], {
                pane: 'trafficPane',
                zIndexOffset: 2500,
                icon: createAISIconStyled(orientation, color, width),
                draggable: Boolean(t.synthetic && aisEditMode)
            }).addTo(aisLayer);
            aisMarkerCreateCount += 1;
            m.on('mouseover', () => {
                hoveredAisKey = key;
                m.openTooltip();
            });
            m.on('mouseout', () => {
                if (hoveredAisKey === key) {
                    hoveredAisKey = null;
                }
            });
            m.on('popupopen', () => {
                aisPopupOpen = true;
                m.setPopupContent(aisPopupHtml(m.latestAisTarget));
            });
            m.on('popupclose', () => {
                aisPopupOpen = false;
                if (followOwnShip) centerOwnship();
            });
            aisMarkers.set(key, m);
        } else {
            if (!m.syntheticDragging) m.setLatLng([lat, lon]);
            updateAISMarkerIcon(m, orientation, color, width);
        }
        if (m.dragging) {
            if (t.synthetic && aisEditMode) m.dragging.enable();
            else m.dragging.disable();
        }
        if (t.synthetic && !m.syntheticHandlersInstalled) {
            m.syntheticHandlersInstalled = true;
            m.on('dragstart', () => {
                m.syntheticDragging = true;
                beginSyntheticDrag();
            });
            m.on('drag', () => {
                const point = m.getLatLng();
                const current = m.latestAisTarget || t;
                const previewCourse = Number(current.course) || 0;
                const previewSpeed = Math.abs(Number(current.speed) || 0);
                const endpoint = destinationPoint(
                    point.lat,
                    point.lng,
                    previewCourse,
                    Math.max(0.05, previewSpeed * 0.1)
                );
                const vector = aisVectors.get(key);
                if (vector) vector.setLatLngs([[point.lat, point.lng], endpoint]);
                const vectorHandle = aisVectorHandles.get(key);
                if (vectorHandle && !vectorHandle.syntheticDragging) vectorHandle.setLatLng(endpoint);
            });
            m.on('dragend', () => {
                const point = m.getLatLng();
                m.syntheticPendingPosition = {
                    lat: point.lat,
                    lon: point.lng,
                    expiresAt: Date.now() + 3000
                };
                m.syntheticDragging = false;
                endSyntheticDrag();
                emitMapCommand({action: 'synthetic_move', mmsi: Number(m.latestAisTarget.mmsi), lat: point.lat, lon: point.lng});
            });
        }
        m.latestAisTarget = {...t, lat, lon, course, speed, heading: orientation};
        if (!m.getPopup()) {
            m.bindPopup(aisPopupHtml(t), {
                pane: 'popupPane',
                maxWidth: 360,
                autoPan: true,
                autoPanPaddingTopLeft: [24, 72],
                autoPanPaddingBottomRight: [24, 24]
            });
        } else if (m.isPopupOpen()) {
            m.setPopupContent(aisPopupHtml(m.latestAisTarget));
        }
        if (t.name) {
            const details = [
                t.name,
                t.mmsi ? `MMSI ${t.mmsi}` : "",
                t.callsign ? `Call ${t.callsign}` : "",
                t.ship_type ? `${t.ship_type}` : "",
                t.destination ? `Dest ${t.destination}` : ""
            ].filter(Boolean).join("<br>");
            if (m.latestTooltipHtml !== details) {
                if (m.getTooltip()) {
                    m.setTooltipContent(details);
                } else {
                    m.bindTooltip(details, {
                        direction: 'top',
                        sticky: true,
                        opacity: 1,
                        pane: 'tooltipPane'
                    });
                }
                m.latestTooltipHtml = details;
            }
            if (hoveredAisKey === key) {
                m.openTooltip();
            }
        } else if (m.getTooltip()) {
            m.unbindTooltip();
            m.latestTooltipHtml = "";
        }
        if (speed > 0.01 || t.synthetic) {
            const vectorDistance = t.synthetic ? Math.max(0.05, speed * 0.1) : speed * 0.1;
            const vectorCoordinates = [[lat, lon], destinationPoint(lat, lon, course, vectorDistance)];
            let vector = aisVectors.get(key);
            if (!vector) {
                vector = L.polyline(vectorCoordinates, {
                    pane: 'vectorPane',
                    color: "#26323d",
                    weight: 1,
                    opacity: 0.75
                }).addTo(aisVectorLayer || aisLayer);
                aisVectors.set(key, vector);
                aisVectorCreateCount += 1;
            } else if (!m.syntheticDragging && !(handle && handle.syntheticDragging)) {
                vector.setLatLngs(vectorCoordinates);
            }
            seenVectors.add(key);
            if (t.synthetic && aisEditMode) {
                const endpoint = vectorCoordinates[1];
                handle = aisVectorHandles.get(key);
                if (!handle) {
                    handle = L.marker(endpoint, {
                        pane: 'trafficPane',
                        zIndexOffset: 2600,
                        icon: syntheticVectorHandleIcon(),
                        draggable: true
                    }).addTo(aisLayer);
                    handle.on('dragstart', () => {
                        handle.syntheticDragging = true;
                        beginSyntheticDrag();
                    });
                    handle.on('drag', () => {
                        const vector = aisVectors.get(key);
                        if (vector) vector.setLatLngs([m.getLatLng(), handle.getLatLng()]);
                    });
                    handle.on('dragend', () => {
                        const targetPoint = m.getLatLng();
                        const vectorPoint = handle.getLatLng();
                        const editedCourse = bearingBetween(targetPoint, vectorPoint);
                        const editedSpeed = Math.max(0.0, distanceBetweenNm(targetPoint, vectorPoint) / 0.1);
                        handle.syntheticPendingVector = {
                            course: editedCourse,
                            speed: editedSpeed,
                            expiresAt: Date.now() + 3000
                        };
                        handle.syntheticDragging = false;
                        endSyntheticDrag();
                        emitMapCommand({
                            action: 'synthetic_vector',
                            mmsi: Number(m.latestAisTarget.mmsi),
                            course: editedCourse,
                            speed: editedSpeed
                        });
                    });
                    aisVectorHandles.set(key, handle);
                } else if (!handle.syntheticDragging) {
                    handle.setLatLng(endpoint);
                }
            } else if (aisVectorHandles.has(key)) {
                aisLayer.removeLayer(aisVectorHandles.get(key));
                aisVectorHandles.delete(key);
            }
        }
    });
    aisVectors.forEach((vector, key) => {
        if (!seenVectors.has(key)) {
            (aisVectorLayer || aisLayer).removeLayer(vector);
            aisVectors.delete(key);
        }
    });
    aisVectorHandles.forEach((handle, key) => {
        if (!seenVectors.has(key) || !seen.has(key)) {
            if (handle.syntheticDragging) {
                handle.syntheticDragging = false;
                endSyntheticDrag();
            }
            aisLayer.removeLayer(handle);
            aisVectorHandles.delete(key);
        }
    });
    aisMarkers.forEach((marker, key) => {
        if (!seen.has(key)) {
            if (marker.syntheticDragging) {
                marker.syntheticDragging = false;
                endSyntheticDrag();
            }
            aisLayer.removeLayer(marker);
            aisMarkers.delete(key);
            if (hoveredAisKey === key) {
                hoveredAisKey = null;
            }
        }
    });
    window.lastAISCount = targets.length;
}

function setAISEditMode(active) {
    aisEditMode = Boolean(active);
}

window.getMapDiagnostics = () => ({
    ownShipHistoryPoints: ownShipHistory.length,
    ownShipHistorySpacingM,
    ownShipHistoryLimit: MAX_OWN_SHIP_HISTORY_POINTS,
    aisMarkers: aisMarkers.size,
    aisVectors: aisVectors.size,
    aisMarkerCreateCount,
    aisVectorCreateCount,
    routeObjects: routeLayer ? routeLayer.getLayers().length : 0,
});

function updateRoute(routeData) {
    if (!window.mapReady) return;

    routeLayer.clearLayers();
    routeWaypointMarkers = [];
    const waypoints = Array.isArray(routeData) ? routeData : (routeData.waypoints || []);
    const wheelOver = Array.isArray(routeData) ? [] : (routeData.wheelOver || []);
    const turnArcs = Array.isArray(routeData) ? [] : (routeData.turnArcs || []);

    const points = [];
    waypoints.forEach((wp, index) => {
        const lat = Number(wp.lat);
        const lon = Number(wp.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        const point = [lat, lon];
        points.push(point);
        const marker = L.marker(point, {
            pane: 'routePane',
            icon: L.divIcon({
                className: "route-wp-icon",
                html: `<div class="route-wp-handle" style="width: 18px; height: 18px; border: 2px solid #ff4b4b; background: transparent; border-radius: 50%; box-sizing: border-box; cursor: grab; pointer-events: auto;"></div>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            }),
            zIndexOffset: 1200
        }).addTo(routeLayer);
        routeWaypointMarkers[index] = marker;
        marker.bindTooltip(`WP ${wp.name || index + 1}`);
        marker.on('contextmenu', (event) => {
            showRouteContextMenu(event.originalEvent, event.latlng, index);
            L.DomEvent.stop(event);
        });
    });

    if (points.length > 1) {
        const line = L.polyline(points, {
            pane: 'routePane',
            color: "#ff4b4b",
            weight: 2,
            opacity: 0.9
        }).addTo(routeLayer);
        line.on('contextmenu', (event) => {
            let insertIndex = 1;
            let best = Infinity;
            const p = map.latLngToLayerPoint(event.latlng);
            for (let i = 0; i < points.length - 1; i++) {
                const a = map.latLngToLayerPoint(points[i]);
                const b = map.latLngToLayerPoint(points[i + 1]);
                const d = distanceToSegment(p, a, b);
                if (d < best) {
                    best = d;
                    insertIndex = i + 1;
                }
            }
            emitRouteEvent({action: 'insert', index: insertIndex, lat: event.latlng.lat, lon: event.latlng.lng});
            L.DomEvent.stop(event);
        });
    }

    turnArcs.forEach((arc) => {
        const arcPoints = Array.isArray(arc.points) ? arc.points : [];
        const latLngs = arcPoints
            .map((p) => [Number(p.lat), Number(p.lon)])
            .filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]));
        if (latLngs.length < 2) return;
        const hasOverlap = Boolean(arc.overlap);
        L.polyline(latLngs, {
            pane: 'routePane',
            color: hasOverlap ? "#ff5252" : "#ffb347",
            weight: hasOverlap ? 2.6 : 1.5,
            opacity: hasOverlap ? 0.98 : 0.92,
            dashArray: hasOverlap ? "4 2" : "6 4"
        }).addTo(routeLayer);
        const compromisePoints = Array.isArray(arc.compromise_points) ? arc.compromise_points : [];
        const compromiseLatLngs = compromisePoints
            .map((p) => [Number(p.lat), Number(p.lon)])
            .filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]));
        if (compromiseLatLngs.length >= 2) {
            L.polyline(compromiseLatLngs, {
                pane: 'routePane',
                color: "#ffd166",
                weight: 2.4,
                opacity: 0.98,
                dashArray: "8 3"
            }).bindTooltip("Controller compromise path for overlapping turn geometry").addTo(routeLayer);
        }
        const transition = arc.conflict_transition;
        if (transition && Number.isFinite(Number(transition.lat)) && Number.isFinite(Number(transition.lon))) {
            L.circleMarker([Number(transition.lat), Number(transition.lon)], {
                pane: 'routePane',
                radius: 6,
                color: "#ffd166",
                weight: 2,
                fillColor: "#0f1d26",
                fillOpacity: 0.95
            }).bindTooltip("Average transition point").addTo(routeLayer);
        }
    });

    wheelOver.forEach(mark => {
        const lat = Number(mark.lat);
        const lon = Number(mark.lon);
        const bearing = Number(mark.bearing);
        const half = (Number(mark.length_nm) || 0.18) / 2;
        if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(bearing)) return;
        const a = destinationPoint(lat, lon, bearing, half);
        const b = destinationPoint(lat, lon, (bearing + 180) % 360, half);
        L.polyline([a, b], {
            pane: 'routePane',
            color: "#ff4b4b",
            weight: 2,
            opacity: 0.95
        }).addTo(routeLayer);
    });
    installRouteEditor();
}

function installRouteEditor() {
    if (!map || routeEditInstalled) return;
    routeEditInstalled = true;
    let active = null;

    map.on('mousedown', (event) => {
        if (!routeWaypointMarkers.length || event.originalEvent.button !== 0) return;
        const nearest = nearestWaypoint(event.containerPoint);
        if (!nearest || nearest.distance > 24) return;

        active = nearest;
        L.DomEvent.stop(event);
        if (event.originalEvent) {
            event.originalEvent.preventDefault();
            event.originalEvent.stopPropagation();
        }
        map.dragging.disable();
        map.doubleClickZoom.disable();
        map.getContainer().style.cursor = 'grabbing';
    });

    map.on('mousemove', (event) => {
        if (!active) return;
        active.marker.setLatLng(event.latlng);
    });

    map.on('mouseup', (event) => {
        if (!active) return;
        const ll = active.marker.getLatLng();
        emitRouteEvent({action: 'move', index: active.index, lat: ll.lat, lon: ll.lng});
        active = null;
        map.dragging.enable();
        map.doubleClickZoom.enable();
        map.getContainer().style.cursor = '';
    });

    map.on('mouseout', () => {
        if (!active) return;
        const ll = active.marker.getLatLng();
        emitRouteEvent({action: 'move', index: active.index, lat: ll.lat, lon: ll.lng});
        active = null;
        map.dragging.enable();
        map.doubleClickZoom.enable();
        map.getContainer().style.cursor = '';
    });
}

function nearestWaypoint(containerPoint) {
    let best = null;
    routeWaypointMarkers.forEach((marker, index) => {
        if (!marker) return;
        const point = map.latLngToContainerPoint(marker.getLatLng());
        const distance = point.distanceTo(containerPoint);
        if (!best || distance < best.distance) {
            best = {marker, index, distance};
        }
    });
    return best;
}

function installMapRouteContext() {
    if (!map || mapContextInstalled) return;
    mapContextInstalled = true;
    map.on('contextmenu', (event) => {
        const nearest = nearestWaypoint(event.containerPoint);
        showRouteContextMenu(event.originalEvent, event.latlng, nearest && nearest.distance <= 24 ? nearest.index : null);
        L.DomEvent.stop(event);
    });
    map.on('dragstart', disableFollowOwnship);
    map.on('click dragstart zoomstart', hideRouteContextMenu);
}

function showRouteContextMenu(domEvent, latlng, waypointIndex) {
    if (offlineAreaSelection) return;
    hideRouteContextMenu();
    contextMenu = document.createElement('div');
    contextMenu.className = 'route-context-menu';

    if (aisEditMode) {
        const addTargetButton = document.createElement('button');
        addTargetButton.textContent = 'Add synthetic AIS target here';
        addTargetButton.onclick = () => {
            emitMapCommand({action: 'synthetic_add', lat: latlng.lat, lon: latlng.lng});
            hideRouteContextMenu();
        };
        contextMenu.appendChild(addTargetButton);
    }

    if (contextMode === "track") {
        const addButton = document.createElement('button');
        addButton.textContent = 'Add waypoint here';
        addButton.onclick = () => {
            emitRouteEvent({action: 'append', lat: latlng.lat, lon: latlng.lng});
            hideRouteContextMenu();
        };
        contextMenu.appendChild(addButton);
    }

    if (contextMode === "track" && waypointIndex !== null && waypointIndex !== undefined) {
        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove waypoint';
        removeButton.onclick = () => {
            emitRouteEvent({action: 'delete', index: waypointIndex});
            hideRouteContextMenu();
        };
        contextMenu.appendChild(removeButton);
    }

    const ownshipButton = document.createElement('button');
    ownshipButton.textContent = 'Set own position here';
    ownshipButton.onclick = () => {
        emitRouteEvent({action: 'set_ownship', lat: latlng.lat, lon: latlng.lng});
        hideRouteContextMenu();
    };
    contextMenu.appendChild(ownshipButton);

    const headingButton = document.createElement('button');
    headingButton.textContent = 'Set heading toward here';
    headingButton.onclick = () => {
        emitRouteEvent({action: 'set_heading', lat: latlng.lat, lon: latlng.lng});
        hideRouteContextMenu();
    };
    contextMenu.appendChild(headingButton);

    document.body.appendChild(contextMenu);
    const x = Math.min(domEvent.clientX, window.innerWidth - contextMenu.offsetWidth - 4);
    const y = Math.min(domEvent.clientY, window.innerHeight - contextMenu.offsetHeight - 4);
    contextMenu.style.left = `${Math.max(4, x)}px`;
    contextMenu.style.top = `${Math.max(4, y)}px`;
}

function hideRouteContextMenu() {
    if (contextMenu) {
        contextMenu.remove();
        contextMenu = null;
    }
}

function distanceToSegment(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const wx = p.x - a.x, wy = p.y - a.y;
    const c1 = vx * wx + vy * wy;
    if (c1 <= 0) return p.distanceTo(a);
    const c2 = vx * vx + vy * vy;
    if (c2 <= c1) return p.distanceTo(b);
    const t = c1 / c2;
    return p.distanceTo(L.point(a.x + t * vx, a.y + t * vy));
}

function consumeRouteEvents() {
    installMapRouteContext();
    const events = routeEvents;
    routeEvents = [];
    return events;
}

window.onload = initMap;
</script>
